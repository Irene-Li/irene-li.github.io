  bio: >-
    I go by "Irene" in my day-to-day life and Yuting Irene Li on papers (to distinguish myself from all the other Y.Li's and I.Li's in the world). 
    
    Trained as a theoretical physicist, I did my PhD with Mike Cates at Cambridge on the statistical physics of active phase-separating systems, such as biomolecular condensates. In my postdocs with Ben Simons (Cambridge) and Edouard Hannezo (ISTA), I worked on various problems spanning active assemblies, zebrafish embryogenesis, somitogenesis, and intestinal organoids. 
